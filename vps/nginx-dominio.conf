# No Silva Drinks — arquivo EXCLUSIVO: /etc/nginx/sites-available/nosilvadrinks.com.br
# Não altera MRO, API, vídeos nem outros certificados.
server {
    listen 80;
    listen [::]:80;
    server_name nosilvadrinks.com.br www.nosilvadrinks.com.br;
    location /.well-known/acme-challenge/ { root /var/www/nosilva-drinks/certbot; }
    location / { return 301 https://nosilvadrinks.com.br$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nosilvadrinks.com.br www.nosilvadrinks.com.br;

    ssl_certificate     /etc/letsencrypt/live/nosilvadrinks.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nosilvadrinks.com.br/privkey.pem;

    client_max_body_size 10M;
    access_log /var/www/nosilva-drinks/logs/nginx-access.log;
    error_log  /var/www/nosilva-drinks/logs/nginx-error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
