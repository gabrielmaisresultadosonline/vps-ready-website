# No Silva Drinks — DOMÍNIO PRÓPRIO atrás do Cloudflare (ex.: nosilvadrinks.com.br)
# Arquivo NOVO e separado: não altera o outro site, nem o SSL dele.
# Troque nosilvadrinks.com.br pelo seu domínio (3 lugares) e 3010 se usou outra porta.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nosilvadrinks.com.br www.nosilvadrinks.com.br;
    return 301 https://nosilvadrinks.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nosilvadrinks.com.br www.nosilvadrinks.com.br;

    # Certificado de Origem do Cloudflare SÓ deste domínio (pasta própria)
    ssl_certificate     /etc/ssl/nosilva/origin.pem;
    ssl_certificate_key /etc/ssl/nosilva/origin.key;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
